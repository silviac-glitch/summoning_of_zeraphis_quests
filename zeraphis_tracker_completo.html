        }

            padding: 8px 16px;

            border-radius: 6px;
            background: #0d1117;
            color: #e8eaed;
            font-size: 13px;
            cursor: pointer;
        }
        .controls button:hover { background: #1c2128; }
        .controls input, .controls select {
            flex: 1;
            min-width: 150px;
        }

            background: #0d1117;
            border: 1px solid #2d333b;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 900px;
            overflow-y: auto;
        }

            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead {
            background: #1c2128;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #2d333b;
        }
        th {
            padding: 12px;
            text-align: left;
            font-weight: 500;
            color: #8b949e;
            border-right: 1px solid #2d333b;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #2d333b;
            border-right: 1px solid #2d333b;
        }
        tr.completata { background: #161b22; opacity: 0.6; }
        tr.branch-row { background: #1c2128; }

        .checkbox { width: 18px; height: 18px; cursor: pointer; }
        .missione-num { font-weight: 600; color: #58a6ff; }
        .branch-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #f0883e;
            border-radius: 50%;
            margin-right: 6px;
        }
        .expand-btn {
            background: none;
            border: none;
            color: #58a6ff;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin-right: 6px;
        }

            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #2d333b;
            margin: 0 4px;
            font-size: 12px;
        }

            color: #8b949e;
            white-space: nowrap;
            padding: 2px 6px;
            background: #161b22;
            border-radius: 4px;
            display: inline-block;
            margin: 2px;
        }

        }

            background: #1c2128;
            border-radius: 4px;

            color: #8b949e;

            font-size: 12px;

function caricaProgresso() {
    const saved = localStorage.getItem('zeraphisProgress');
    return saved ? JSON.parse(saved) : [];
}

function salvaProgresso(completate) {
    localStorage.setItem('zeraphisProgress', JSON.stringify(completate));
    aggiornaStats();
}

function toggleMissione(idx) {
    let completate = caricaProgresso();
    const pos = completate.indexOf(idx);
    pos > -1 ? completate.splice(pos, 1) : completate.push(idx);
    salvaProgresso(completate);
    renderTable();
}

function resetProgress() {
    if(confirm('Resettare tutto il progresso?')) {
        localStorage.removeItem('zeraphisProgress');
        aggiornaStats();
        renderTable();
    }
}

function aggiornaStats() {
    const completate = caricaProgresso();
    const perc = Math.round((completate.length / datiMissioni.length) * 100);
    document.getElementById('completateVal').textContent = completate.length;
    document.getElementById('progressVal').textContent = perc + '%';
}

function renderLegenda() {
    const leg = document.getElementById('legendContainer');
    leg.innerHTML = '';
    capitoli.forEach(c => {
        if(c.nome) {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<img src="${c.icona}" alt="Cap ${c.num}"> Cap. ${c.num}: ${c.nome}`;
            leg.appendChild(item);
        }
    });
}

function getCapIconi(caps) {
    return caps.map(c => {
        const cap = capitoli.find(x => x.num === c);
        return cap ? `<img src="${cap.icona}" alt="Cap ${c}" style="width:20px; height:20px; margin:2px;">` : '';
    }).join('');
}

function renderTable() {
    const completate = caricaProgresso();
    const filtro = document.getElementById('filtroCapitolo').value;
    const ricerca = document.getElementById('cercaMissione').value.toLowerCase();
    const body = document.getElementById('missioniBody');
    body.innerHTML = '';
    
    datiMissioni.forEach((m, idx) => {
        let mostra = true;
        if(filtro && !m.cap.includes(parseInt(filtro))) mostra = false;
        if(ricerca && !m.seq.toString().includes(ricerca)) mostra = false;
        
        if(!mostra) return;
        
        const checked = completate.includes(idx);
        const row = document.createElement('tr');
        row.className = checked ? 'completata' : '';
        
        const taskHtml = m.task.map((t, i) => `<div class="task-item">Task ${i+1}: ${t}</div>`).join('');
        const capHtml = getCapIconi(m.cap);
        
        row.innerHTML = `
            <td><input type="checkbox" class="checkbox" ${checked ? 'checked' : ''} onchange="toggleMissione(${idx})" /></td>
            <td class="missione-num">${m.seq}</td>
            <td>${m.ep || '—'}</td>
            <td><span class="ev-badge">${m.ev || '—'}</span></td>
            <td><small>${m.inizia}</small></td>
            <td>${m.branch ? '<span class="branch-indicator"></span>' : ''}${taskHtml || '(Vedi branch)'}</td>
            <td style="font-size:12px;">${capHtml || '—'}</td>
        `;
        body.appendChild(row);
        
        if(m.branch && m.branches) {
            m.branches.forEach(b => {
                const branchRow = document.createElement('tr');
                branchRow.className = 'branch-row';
                const branchTaskHtml = b.task.map((t, i) => `<div class="task-item">Task ${i+1}: ${t}</div>`).join('');
                const branchCapHtml = getCapIconi(b.cap || []);
                branchRow.innerHTML = `
                    <td></td>
                    <td colspan="2" style="font-size:11px; color:#8b949e;"><em>└─ ${b.cond}</em></td>
                    <td></td>
                    <td></td>
                    <td>${branchTaskHtml}</td>
                    <td>${branchCapHtml || '—'}</td>
                `;
                body.appendChild(branchRow);
            });
        }
    });
}

function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const completate = caricaProgresso();
    const data = [];
    
    datiMissioni.forEach((m, idx) => {
        data.push([m.seq, m.ep || '—', completate.includes(idx) ? '✓' : '', m.ev || '—', m.inizia, m.task[0] || '(Branch)']);
    });
    
    doc.setFontSize(14);
    doc.text('L\'evocazione di Zeraphis', 10, 10);
    doc.setFontSize(10);
    doc.text('Tracker Missioni - ' + new Date().toLocaleDateString('it-IT'), 10, 18);
    doc.text('Completate: ' + completate.length + '/' + datiMissioni.length, 10, 24);
    
    doc.autoTable({
        head: [['SEQ', 'EP', '✓', 'EV', 'Inizia', 'Task']],
        body: data,
        startY: 30,
        fontSize: 7,
        columnStyles: {0: {cellWidth: 12}, 1: {cellWidth: 10}, 2: {cellWidth: 8}, 3: {cellWidth: 12}, 4: {cellWidth: 50}, 5: {cellWidth: 100}}
    });
    
    doc.save('Zeraphis_' + new Date().toLocaleDateString('it-IT') + '.pdf');
}

renderLegenda();
