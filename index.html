        * {

            padding: 0;
            box-sizing: border-box;

        /* CSS Variables - Tema scuro sofisticato */
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #0d1117;
            --bg-tertiary: #1c2128;
            --border-color: #2d333b;
            --text-primary: #e8eaed;
            --text-secondary: #c9cace;
            --accent: #58a6ff;
            --accent-dark: #1f6feb;
            --success: #238636;
            --danger: #da3633;
            --warning: #d29922;
            --info: #0969da;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #58a6ff 0%, #79c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 0.5rem;
        }

        /* Filtri e Ricerca */
        .controls {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        select {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        /* Tabella */
        .table-wrapper {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .table-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead {
            background: var(--bg-tertiary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 10;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 0.85rem;
        }

        th:nth-child(1) { width: 4%; text-align: center; }
        th:nth-child(2) { width: 6%; }
        th:nth-child(3) { width: 8%; }
        th:nth-child(4) { width: 20%; }
        th:nth-child(5) { width: 40%; }
        th:nth-child(6) { width: 15%; }
        th:nth-child(7) { width: 7%; text-align: center; }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
            padding-left: -3px;
        }

        td {
            padding: 1rem;
            vertical-align: top;
        }

        /* Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: 700;
        }

        input[type="checkbox"]:hover {
            border-color: var(--accent);
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        input[type="checkbox"]:checked::after {
            content: "✓";
            font-size: 14px;
            font-weight: bold;
            color: var(--bg-primary);
        }

        /* Righe completate */
        tr.completata {
            opacity: 0.65;
            background: var(--bg-tertiary);
        }

        tr.completata td {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        /* Branch rows */
        tr.branch-row {
            background: var(--bg-tertiary);
            font-size: 0.9rem;
        }

        tr.branch-row td:first-child {
            padding-left: 2rem;
        }

        /* Badge per task */
        .task-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .task-item {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
            border-radius: 3px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .task-item strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* Capitoli/Categorie */
        .capitoli {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .cap-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: default;
            transition: all 0.2s ease;
            border: 1px solid var(--accent-dark);
        }

        .cap-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(88, 166, 255, 0.3);
        }

        /* EV (Evento) */
        .ev-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--success) 0%, #2ea043 100%);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid var(--border-color);
        }

        /* Pulsanti */
        button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        button:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Footer */
        .footer {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .header {
                padding: 1rem;
            }

            .controls,
            .button-group,
            .table-wrapper {
                padding: 0 1rem;
            }

            th:nth-child(4),
            th:nth-child(5) {
                font-size: 0.75rem;
            }

            td {
                padding: 0.75rem 0.5rem;
            }

            .task-item {
                font-size: 0.85rem;
            }
        }

        /* Scroll Bar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

        // ===== VARIABILI GLOBALI =====
        let completate = [];
        let filtroAttivo = {ricerca: '', capitolo: '', stato: ''};

        // ===== FUNZIONI LOCALSTORAGE =====
        function caricaProgresso() {
            const saved = localStorage.getItem('zeraphisProgress');
            return saved ? JSON.parse(saved) : [];
        }

        function salvaProgresso(arr) {
            localStorage.setItem('zeraphisProgress', JSON.stringify(arr));
            aggiornaStats();
            const now = new Date().toLocaleTimeString('it-IT');
            document.getElementById('saveTime').textContent = `Salvato: ${now}`;
        }

        // ===== FUNZIONI UI =====
        function aggiornaStats() {
            const tot = datiMissioni.length;
            const comp = completate.length;
            const perc = tot > 0 ? Math.round((comp / tot) * 100) : 0;
            
            document.getElementById('completateVal').textContent = comp;
            document.getElementById('totaliVal').textContent = tot;
            document.getElementById('progressVal').textContent = perc + '%';
        }

        function toggleMissione(idx) {
            const pos = completate.indexOf(idx);
            if (pos > -1) {
                completate.splice(pos, 1);
            } else {
                completate.push(idx);
            }
            salvaProgresso(completate);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            datiMissioni.forEach((m, idx) => {
                // Filtri
                if (filtroAttivo.ricerca && !m.seq.toString().includes(filtroAttivo.ricerca)) return;
                if (filtroAttivo.capitolo && !m.cap.includes(parseInt(filtroAttivo.capitolo))) return;
                if (filtroAttivo.stato === 'completata' && !completate.includes(idx)) return;
                if (filtroAttivo.stato === 'incomplete' && completate.includes(idx)) return;

                // Riga principale
                const tr = document.createElement('tr');
                if (completate.includes(idx)) tr.classList.add('completata');

                const chkHtml = `<input type="checkbox" ${completate.includes(idx) ? 'checked' : ''} onchange="toggleMissione(${idx})">`;
                const epHtml = m.ep ? m.ep : '';
                const taskHtml = m.task.map(t => `<div class="task-item">${t}</div>`).join('');
                const capHtml = m.cap.length > 0 ? m.cap.map(c => `<div class="cap-badge">${c}</div>`).join('') : '';
                const evHtml = m.ev ? `<div class="ev-badge">${m.ev}</div>` : '';

                tr.innerHTML = `
                    <td style="text-align: center;">${chkHtml}</td>
                    <td><strong>${m.seq}</strong></td>
                    <td>${epHtml}</td>
                    <td>${m.inizia}</td>
                    <td><div class="task-container">${taskHtml}</div></td>
                    <td><div class="capitoli">${capHtml}</div></td>
                    <td style="text-align: center;">${evHtml}</td>
                `;
                tbody.appendChild(tr);

                // Branch rows
                if (m.branch && m.branches) {
                    m.branches.forEach(b => {
                        const branchTr = document.createElement('tr');
                        branchTr.classList.add('branch-row');
                        if (completate.includes(idx)) branchTr.classList.add('completata');

                        const branchTaskHtml = b.task.map(t => `<div class="task-item">${t}</div>`).join('');
                        const branchCapHtml = b.cap.length > 0 ? b.cap.map(c => `<div class="cap-badge">${c}</div>`).join('') : '';

                        branchTr.innerHTML = `
                            <td></td>
                            <td></td>
                            <td></td>
                            <td><em style="color: var(--text-secondary);">${b.cond}</em></td>
                            <td><div class="task-container">${branchTaskHtml}</div></td>
                            <td><div class="capitoli">${branchCapHtml}</div></td>
                            <td></td>
                        `;
                        tbody.appendChild(branchTr);
                    });
                }
            });
        }

        function initFiltri() {
            const capitoli = new Set();
            datiMissioni.forEach(m => m.cap.forEach(c => capitoli.add(c)));
            const select = document.getElementById('filtroCapitolo');
            Array.from(capitoli).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `Capitolo ${c}`;
                select.appendChild(opt);
            });
        }

        // ===== FILTRI =====
        document.getElementById('ricerca').addEventListener('keyup', (e) => {
            filtroAttivo.ricerca = e.target.value;
            renderTable();
        });

        document.getElementById('filtroCapitolo').addEventListener('change', (e) => {
            filtroAttivo.capitolo = e.target.value;
            renderTable();
        });

        document.getElementById('filtroStato').addEventListener('change', (e) => {
            filtroAttivo.stato = e.target.value;
            renderTable();
        });

        // ===== EXPORT PDF =====
        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({orientation: 'landscape'});
            const pageHeight = doc.internal.pageSize.getHeight();
            const pageWidth = doc.internal.pageSize.getWidth();
            let yPos = 10;

            doc.setFontSize(16);
            doc.text('📋 Tracker Missioni - Esportazione', pageWidth / 2, yPos, {align: 'center'});
            yPos += 10;

            doc.setFontSize(10);
            const stats = `Completate: ${completate.length}/${datiMissioni.length} (${Math.round((completate.length/datiMissioni.length)*100)}%)`;
            doc.text(stats, pageWidth / 2, yPos, {align: 'center'});
            yPos += 8;

            const columns = ['✓', 'SEQ', 'EP', 'Inizia se', 'Task', 'Cap', 'EV'];
            const rows = [];

            datiMissioni.forEach((m, idx) => {
                const chk = completate.includes(idx) ? '✓' : '';
                rows.push([
                    chk,
                    m.seq,
                    m.ep || '',
                    m.inizia.substring(0, 25),
                    m.task[0].substring(0, 30),
                    m.cap.join(','),
                    m.ev || ''
                ]);
            });

            doc.autoTable({
                head: [columns],
                body: rows,
                startY: yPos,
                margin: 5,
                theme: 'grid',
                styles: {fontSize: 8},
                headStyles: {fillColor: [88, 166, 255]},
                alternateRowStyles: {fillColor: [220, 220, 220]}
            });

            doc.save('tracker-missioni.pdf');
        }

        function resetall() {
            if (confirm('⚠️ Sei sicuro? Questa azione non si può annullare!')) {
                completate = [];
                salvaProgresso([]);
                renderTable();
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            completate = caricaProgresso();
            initFiltri();
            renderTable();
            aggiornaStats();
        });
    </script>
